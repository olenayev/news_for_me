name: Daily News Agent

on:
  schedule:
    - cron: "0 4 * * *"   # Every day at 7:00 AM UTC
  workflow_dispatch:        # Allows manual trigger from GitHub UI

permissions:
  contents: write 

jobs:
  send-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install google-genai requests python-dotenv pdfminer.six gtts elevenlabs

      - name: Run news agent
        run: python news_agent.py
        env:
          GEMINI_API_KEY:     ${{ secrets.GEMINI_API_KEY }}
          NEWSAPI_KEY:        ${{ secrets.NEWSAPI_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          
      - name: Commit and push JSON output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config pull.rebase false
          git pull origin main --no-edit
          git add docs/
          git diff --staged --quiet || git commit -m "📰 Daily news update $(date +'%Y-%m-%d')"
          git push
